<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosaico 音乐</title><link rel="stylesheet" href="/style.css"></head><body><main>
<header><div><p class="eyebrow">MOSAICO · MUSIC</p><h1>听你喜欢的</h1></div><button id="login">扫码登录</button><button id="logout" hidden>退出账号</button></header>
<nav aria-label="页面"><button data-tab="player" class="active">正在播放</button><button data-tab="search">搜歌</button><button data-tab="library">我的歌单</button><button data-tab="settings">设置</button></nav>
<section id="player" class="page"><div class="player-card"><div class="record"><img id="cover" alt="专辑封面" hidden><span>♪</span></div><div class="track"><p id="connection" class="eyebrow">正在连接设备</p><h2 id="title">选一首喜欢的歌</h2><p id="artist">从歌单或搜歌开始</p><p id="lyric"></p><progress id="progress" value="0" max="1"></progress><p id="time">0:00 / 0:00</p><div class="controls"><button id="prev">上一首</button><button id="toggle" class="primary">播放</button><button id="next">下一首</button></div></div></div><div class="output-summary"><div><span>当前输出</span><strong id="currentOutput">等待确认</strong><p id="outputState">尚未确认设备</p></div><button id="openSettings">更改输出</button></div></section>
<section id="search" class="page" hidden><h2>找一首歌</h2><p>输入中文歌名、歌手，或用 ESP32 的麦克风说出来。</p><form id="searchForm"><input id="query" aria-label="歌名或歌手" placeholder="歌名、歌手…" required maxlength="120"><button class="primary">搜歌</button><button type="button" id="voice">语音搜歌</button></form><p id="voiceState" role="status"></p><div id="searchList" class="list"></div></section>
<section id="library" class="page" hidden><div class="section-title"><h2>我的歌单</h2><button id="playlists">刷新歌单</button></div><div id="libraryList" class="list"></div></section>
<section id="settings" class="page" hidden><h2>声音与设备</h2><p>先选择具体设备，再点试听确认。切换输出后重新点播放。</p><div class="settings-card"><p class="eyebrow">已选输出</p><h3 id="selectedName">等待确认</h3><p id="selectedState"></p><button id="testAudio" class="primary">试听此设备</button></div><div class="section-title"><h3>本机与有线输出</h3><button id="refreshAudio">刷新设备</button></div><p id="hostName"></p><div id="outputs" class="device-grid"></div><div class="section-title"><h3>蓝牙音箱与耳机</h3><button id="scanBluetooth">扫描附近设备</button></div><p id="audioMessage" role="status"></p><div id="bluetoothList" class="list"></div><div class="volume-card"><label for="volume">音量</label><input id="volume" type="range" min="0" max="100" value="30"><output id="volumeText">30%</output></div><div class="settings-card"><h3>语音与触屏</h3><p id="speechState">正在检查本机语音识别</p><button id="authorizeSpeech">启用本机语音识别</button><button id="device">在 ESP32 打开音乐</button></div></section>
<p id="error" role="alert"></p><footer>在设置中确认声音去向。中文拼音与语音搜歌也可从 ESP32 发起。</footer>
<dialog id="qrDialog"><h2>网易云音乐登录</h2><p>用手机网易云 App 扫码并确认。</p><img id="qr" alt="登录二维码"><p id="qrStatus">正在生成二维码…</p><button id="refreshQr">刷新二维码</button><button id="closeQr">关闭</button></dialog>
</main><script src="/app.js"></script></body></html>
